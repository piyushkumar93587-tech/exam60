<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One GitHub Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; padding: 30px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #24292e; margin-bottom: 20px; border-bottom: 2px solid #eaecef; padding-bottom: 10px; }
        .section { background: #f8f9fa; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #e1e4e8; }
        h4 { margin-top: 0; color: #586069; text-align: left; }
        input[type="text"], input[type="number"] { width: 85%; padding: 10px; margin: 10px 0; border: 1px solid #d1d5da; border-radius: 6px; font-size: 16px; text-align: center; }
        .two-inputs input { width: 35%; display: inline-block; margin: 5px; }
        button { width: 90%; padding: 12px; font-size: 16px; background-color: #2ea44f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2c974b; }
        .result-box { margin-top: 15px; font-size: 18px; font-weight: bold; color: #0366d6; background: #e6f4ea; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧮 GitHub All-in-One Calculator</h2>

    <!-- TARIKA 1: KUCHH BHI JODEIN (UNLIMITED NUMBERS) -->
    <div class="section">
        <h4>✨ Kod 1: Kuchh bhi Jodein (Comma se alag karein)</h4>
        <input type="text" id="multiInput" placeholder="Jaise: 10, 20, 30.5, 40">
        <button onclick="addUnlimited()">Sabh ko Jodein</button>
        <div class="result-box" id="result1">Result: 0</div>
    </div>

    <!-- TARIKA 2: DO NUMBERS KO JODEIN -->
    <div class="section">
        <h4>🔢 Kod 2: Sirf Do Numbers Jodein</h4>
        <div class="two-inputs">
            <input type="number" id="num1" placeholder="No. 1">
            <span style="font-size: 20px; font-weight: bold;">+</span>
            <input type="number" id="num2" placeholder="No. 2">
        </div>
        <button onclick="addTwo()">Do Numbers Jodein</button>
        <div class="result-box" id="result2">Result: 0</div>
    </div>
</div>

<script>
// Code 1: Unlimited numbers jodne ka logic
function addUnlimited() {
    let inputVal = document.getElementById('multiInput').value;
    if (!inputVal.trim()) {
        document.getElementById('result1').innerText = "Kripya numbers dalein!";
        return;
    }
    
    // Comma se numbers ko alag karke array banana
    let numbers = inputVal.split(',');
    let total = 0;
    
    for (let i = 0; i < numbers.length; i++) {
        let num = parseFloat(numbers[i].trim());
        if (!isNaN(num)) {
            total += num;
        }
    }
    document.getElementById('result1').innerText = "Total Sum: " + total;
}

// Code 2: Sirf do numbers jodne ka logic
function addTwo() {
    let n1 = parseFloat(document.getElementById('num1').value);
    let n2 = parseFloat(document.getElementById('num2').value);
    
    if (isNaN(n1) || isNaN(n2)) {
        document.getElementById('result2').innerText = "Dono box bharein!";
        return;
    }
    
    let sum = n1 + n2;
    document.getElementById('result2').innerText = "Total Sum: " + sum;
}
</script>

</body>
</html>
