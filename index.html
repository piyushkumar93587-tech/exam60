<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Future AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- जार्विस का चमकता हुआ कोर -->
        <div class="jarvis-core-box">
            <div class="jarvis-core" id="core"></div>
            <p id="status">JARVIS: स्लीप मोड में हूँ, सर।</p>
        </div>

        <!-- लक्ज़री ग्लास कार्ड -->
        <div class="glass-card">
            <h2>कमांड्स जो आप बोल सकते हैं:</h2>
            <ul>
                <li>🗣️ "Hello Jarvis"</li>
                <li>🌐 "Open Google"</li>
                <li>📺 "Open YouTube"</li>
            </ul>
            <button id="start-btn">JARVIS को जगाएं</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
